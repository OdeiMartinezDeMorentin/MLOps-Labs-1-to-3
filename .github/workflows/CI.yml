name: CI

on: [push, pull_request]

jobs:
  build:
    name: Format, lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv (with cache of the dependencies)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install packages (fails if uv.lock is out of date)
        run: make install

      - name: Check format
        run: make format-check

      - name: Lint
        run: make lint

      - name: Test (with minimum coverage)
        run: make test

