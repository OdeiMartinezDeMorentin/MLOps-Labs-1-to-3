name: CICD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_NAME: image-classifier-api

jobs:
  # 1. Continuous integration: format, lint and tests (also for pull requests)
  build:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (with cache of the dependencies)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install packages (fails if uv.lock is out of date)
        run: make install

      - name: Check format
        run: make format-check

      - name: Lint
        run: make lint

      - name: Test (with minimum coverage)
        run: make test

  # 2. Build the image, check that the container works and push it to Docker Hub
  docker:
    name: Build, smoke-test and push the image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (the container starts and answers /health)
        run: |
          docker run -d --name api -p 8000:8000 ${{ env.IMAGE_NAME }}:test
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo; echo "API is up"; exit 0
            fi
            sleep 1
          done
          echo "The API did not start"; docker logs api; exit 1

      # Only for pushes to main (not for pull requests)
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the image (tags latest and commit SHA)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha

  # 3. Continuous deployment of the backend (REST API) on Modal
  deploy-backend:
    name: Deploy the backend on Modal
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (with cache of the dependencies)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Modal uses the image of this commit (tag = commit SHA) pushed by the docker job
      - name: Deploy modal_app.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          DOCKER_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: uv run --locked modal deploy modal_app.py

  # 4. Continuous deployment of the GUI (Gradio) on Modal: a second service (gui_app.py)
  deploy-gui:
    name: Deploy the GUI on Modal
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (with cache of the dependencies)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # BACKEND_API_URL: fixed URL of the API on Modal
      - name: Deploy gui_app.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          API_URL: ${{ secrets.BACKEND_API_URL }}
        run: uv run --locked modal deploy gui_app.py
